version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: wa_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    command: --wiredTigerCacheSizeGB 0.25
    environment:
      MONGO_INITDB_DATABASE: whatsapp_saas
    networks:
      - wa_network

  redis:
    image: redis:7-alpine
    container_name: wa_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - wa_network

  backend:
    build:
      context: ./python_backend
      dockerfile: Dockerfile
    container_name: python_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017
      DB_NAME: whatsapp_saas
      JWT_SECRET: ${JWT_SECRET:-change_this_in_production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@restaurant.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
      WA_PHONE_NUMBER_ID: ${WA_PHONE_NUMBER_ID}
      WA_BUSINESS_ACCOUNT_ID: ${WA_BUSINESS_ACCOUNT_ID}
      WA_ACCESS_TOKEN: ${WA_ACCESS_TOKEN}
      WA_VERIFY_TOKEN: ${WA_VERIFY_TOKEN:-restaurant_webhook_verify_2024}
      WA_APP_SECRET: ${WA_APP_SECRET}
      WA_API_VERSION: v19.0
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      FRONTEND_URL: http://localhost:3000
    depends_on:
      - mongodb
      - redis
    networks:
      - wa_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wa_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
      NEXT_PUBLIC_SOCKET_URL: http://localhost:5000
    depends_on:
      - backend
    networks:
      - wa_network

  nginx:
    image: nginx:alpine
    container_name: wa_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - wa_network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: wa_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - wa_network

volumes:
  mongodb_data:

networks:
  wa_network:
    driver: bridge
