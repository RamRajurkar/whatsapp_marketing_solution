services:
  mongodb:
    image: mongo:7
    container_name: wa_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    command: --wiredTigerCacheSizeGB 0.25
    environment:
      MONGO_INITDB_DATABASE: whatsapp_saas
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    networks:
      - wa_network

  redis:
    image: redis:7-alpine
    container_name: wa_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: '0.5'
    networks:
      - wa_network

  backend:
    build:
      context: ./python_backend
      dockerfile: Dockerfile
    container_name: python_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      TZ: Asia/Kolkata
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017
      DB_NAME: whatsapp_saas
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change_this_in_production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@restaurant.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
      WA_PHONE_NUMBER_ID: ${WA_PHONE_NUMBER_ID}
      WA_BUSINESS_ACCOUNT_ID: ${WA_BUSINESS_ACCOUNT_ID}
      WA_ACCESS_TOKEN: ${WA_ACCESS_TOKEN}
      WA_VERIFY_TOKEN: ${WA_VERIFY_TOKEN:-restaurant_webhook_verify_2024}
      WA_APP_SECRET: ${WA_APP_SECRET}
      WA_APP_ID: ${WA_APP_ID}
      WA_API_VERSION: v19.0
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      FRONTEND_URL: http://localhost:3000
    volumes:
      - ./python_backend/uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    networks:
      - wa_network

  # Celery worker — handles broadcast sending in a separate process
  worker:
    build:
      context: ./python_backend
      dockerfile: Dockerfile
    container_name: wa_celery_worker
    restart: unless-stopped
    command: celery -A app.celery_app:celery_app worker --loglevel=info --concurrency=4 --max-memory-per-child=200000
    environment:
      TZ: Asia/Kolkata
      MONGODB_URI: mongodb://mongodb:27017
      DB_NAME: whatsapp_saas
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change_this_in_production}
      WA_PHONE_NUMBER_ID: ${WA_PHONE_NUMBER_ID}
      WA_BUSINESS_ACCOUNT_ID: ${WA_BUSINESS_ACCOUNT_ID}
      WA_ACCESS_TOKEN: ${WA_ACCESS_TOKEN}
      WA_APP_SECRET: ${WA_APP_SECRET}
      WA_APP_ID: ${WA_APP_ID}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    networks:
      - wa_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wa_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      TZ: Asia/Kolkata
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:5000
      NEXT_PUBLIC_SOCKET_URL: http://localhost:5000
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    networks:
      - wa_network

  nginx:
    image: nginx:alpine
    container_name: wa_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - wa_network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: wa_tunnel
    restart: unless-stopped
    command: tunnel --url http://backend:5000
    networks:
      - wa_network

volumes:
  mongodb_data:
  uploads_data:

networks:
  wa_network:
    driver: bridge
